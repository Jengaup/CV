name = "josealbertopr-contact"
main = "contact-worker.js"
compatibility_date = "2026-10-01"

# Route on the zone so requests are same-site: no workers.dev host, simpler CSP.
routes = [{ pattern = "josealbertopr.com/api/contact", zone_name = "josealbertopr.com" }]

[vars]
ALLOWED_ORIGIN = "https://josealbertopr.com"

# Native rate limiting: 5 requests / 60 s per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never in this file):
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put EMAILJS_USER_ID
#   wrangler secret put EMAILJS_SERVICE_ID
#   wrangler secret put EMAILJS_TEMPLATE_ID
#   wrangler secret put EMAILJS_PRIVATE_KEY   (EmailJS "Private Key"; enable "Use Private Key" in EmailJS security settings)
